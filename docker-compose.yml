services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: "8000"
    ports:
      - "8001:8000"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      PORT: "80"
    ports:
      - "8080:80"
    depends_on:
      - api
